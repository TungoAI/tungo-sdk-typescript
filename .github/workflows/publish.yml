# Generated by tungo-sdkgen. Do not edit.
#
# Publishes @tungoai/sdk (npm) when a tag vX.Y.Z is pushed. To retry a failed
# release, run this workflow manually FROM THE TAG (gh workflow run publish.yml --ref vX.Y.Z).
# The job fails when a credential is missing or the registry does not serve the new version.
#
# Repository setup:
#   - environment "release" (add required reviewers there to gate publishing)
#   - npm trusted publisher for this repository, workflow publish.yml, environment release;
#     or secret NPM_TOKEN (granular token with publish access to @tungoai/sdk)
name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify the release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set and verify the version from the tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this workflow from a release tag vX.Y.Z (got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}')."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release-version.sh set "${version}"
          bash scripts/release-version.sh check-release "${version}"
          if ! git diff --exit-code; then
            echo "::error::The commit tagged ${GITHUB_REF_NAME} carries a different version. Bump VERSION in tungo-sdkgen, regenerate, commit, and tag the new commit with a new version."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Build the tarball
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install --no-audit --no-fund; fi
          npm pack
          test -f "tungoai-sdk-${VERSION}.tgz"
      - name: Choose registry authentication
        id: auth
        env:
          REGISTRY_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${REGISTRY_TOKEN}" ]]; then
            echo "mode=token" >> "${GITHUB_OUTPUT}"
          else
            echo "NPM_TOKEN is not set: using trusted publishing (OIDC)."
            echo "mode=oidc" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish to npm (trusted publishing)
        if: steps.auth.outputs.mode == 'oidc'
        run: |
          npm install --global 'npm@^11.5.1'
          npm publish "tungoai-sdk-${VERSION}.tgz" --access public --provenance
      - name: Publish to npm (token)
        if: steps.auth.outputs.mode == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "tungoai-sdk-${VERSION}.tgz" --access public --provenance
      - name: Wait until npm serves the new version
        env:
          URL: https://registry.npmjs.org/@tungoai%2Fsdk/${{ needs.preflight.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS -A tungo-sdk-release -o /dev/null "${URL}"; then
              echo "${URL} is available."
              exit 0
            fi
            echo "Not available yet (attempt ${attempt})."
            sleep 10
          done
          echo "::error::npm did not serve version ${VERSION} within 5 minutes: ${URL}"
          exit 1

  github-release:
    name: GitHub release
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release from the CHANGELOG entry
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          awk -v v="${VERSION}" '
            index($0, "## [" v "]") == 1 { printing = 1; next }
            /^## \[/ { printing = 0 }
            /^\[[^]]+\]: / { next }
            printing { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [[ ! -s "${RUNNER_TEMP}/notes.md" ]]; then
            echo "::error::CHANGELOG.md has no notes for ${VERSION}."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
